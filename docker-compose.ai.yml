x-ai: &ai
  image: sticker-foundry-backend-ai:local
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
    args:
      WITH_AI: "true"
  environment:
    BACKGROUND_REMOVAL_COMMAND: ${BACKGROUND_REMOVAL_COMMAND:-rembg i {input} {output}}

services:
  backend:
    <<: *ai
  worker:
    <<: *ai
  export-worker:
    <<: *ai
  email-worker:
    <<: *ai
