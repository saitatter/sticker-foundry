services:
  backend:
    environment: &production
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET for production}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set the public HTTPS origin}
      AUTH_REFRESH_COOKIE_SECURE: "true"
  worker:
    environment:
      <<: *production
  export-worker:
    environment:
      <<: *production
  email-worker:
    environment:
      <<: *production
