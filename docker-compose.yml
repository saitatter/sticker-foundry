x-runtime: &runtime
  image: sticker-foundry-backend:local
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  restart: unless-stopped
  environment:
    APP_ENV: ${APP_ENV:-development}
    DATABASE_URL: postgresql://${POSTGRES_USER:-stickers}:${POSTGRES_PASSWORD:-stickers}@postgres:5432/${POSTGRES_DB:-stickers}
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
    ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
    REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    AUTH_REFRESH_COOKIE_ENABLED: true
    AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
    AUTH_REFRESH_COOKIE_SAME_SITE: ${AUTH_REFRESH_COOKIE_SAME_SITE:-lax}
    AUTH_REFRESH_COOKIE_NAME: stickerfoundry_refresh
    AUTH_REFRESH_COOKIE_PATH: /api/auth
    CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
    DATA_DIR: /data
    EXPORT_CACHE_DIR: /data/export-cache
    PASSWORD_RESET_PUBLIC_URL: ${PASSWORD_RESET_PUBLIC_URL:-http://localhost:8080}
    PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
    INSTANCE_NAME: ${INSTANCE_NAME:-Sticker Foundry}
    INSTANCE_DESCRIPTION: ${INSTANCE_DESCRIPTION:-Self-hosted sticker pack management}
    REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
    REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
    STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-}
    AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
    STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_PREFIX: ${S3_PREFIX:-packs}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-25000000}
    UPLOAD_MAX_TOTAL_PIXELS: ${UPLOAD_MAX_TOTAL_PIXELS:-80000000}
    UPLOAD_MAX_ANIMATED_EDIT_PIXELS: ${UPLOAD_MAX_ANIMATED_EDIT_PIXELS:-20000000}
    UPLOAD_MAX_ANIMATED_FRAMES: ${UPLOAD_MAX_ANIMATED_FRAMES:-300}
    QUEUE_PREFIX: ${QUEUE_PREFIX:-sticker-foundry}
    QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS:-3}
    QUEUE_BACKOFF_MS: ${QUEUE_BACKOFF_MS:-1000}
    MEDIA_QUEUE_MAX_WAITING: ${MEDIA_QUEUE_MAX_WAITING:-50}
    MEDIA_QUEUE_RETRY_AFTER_SECONDS: ${MEDIA_QUEUE_RETRY_AFTER_SECONDS:-5}
    BACKGROUND_REMOVAL_COMMAND: ${BACKGROUND_REMOVAL_COMMAND:-}
    BACKGROUND_REMOVAL_TIMEOUT_MS: ${BACKGROUND_REMOVAL_TIMEOUT_MS:-120000}
    U2NET_HOME: /data/rembg
    THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
    THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
  volumes:
    - foundry-data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stickers}
      POSTGRES_USER: ${POSTGRES_USER:-stickers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stickers}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    <<: *runtime
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *runtime
    command: ["python", "-m", "foundry.worker", "--queue", "media", "--concurrency", "${MEDIA_QUEUE_CONCURRENCY:-1}"]
    depends_on:
      backend:
        condition: service_healthy

  export-worker:
    <<: *runtime
    command: ["python", "-m", "foundry.worker", "--queue", "export", "--concurrency", "${EXPORT_QUEUE_CONCURRENCY:-1}"]
    depends_on:
      backend:
        condition: service_healthy

  email-worker:
    <<: *runtime
    command: ["python", "-m", "foundry.worker", "--queue", "email", "--concurrency", "${EMAIL_QUEUE_CONCURRENCY:-2}"]
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  redis-data:
  foundry-data:
