services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stickers}
      POSTGRES_USER: ${POSTGRES_USER:-stickers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stickers}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stickers -d stickers"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-stickers}:${POSTGRES_PASSWORD:-stickers}@postgres:5432/${POSTGRES_DB:-stickers}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-long-random-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      INSTANCE_NAME: ${INSTANCE_NAME:-StickerFoundry}
      INSTANCE_DESCRIPTION: ${INSTANCE_DESCRIPTION:-Self-hosted sticker pack management}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
    volumes:
      - foundry-data:/data
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres-data:
  foundry-data:
