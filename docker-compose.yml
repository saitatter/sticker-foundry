services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stickers}
      POSTGRES_USER: ${POSTGRES_USER:-stickers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stickers}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-stickers}\" -d \"$${POSTGRES_DB:-stickers}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sticker-foundry-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: sticker-foundry-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-stickers}:${POSTGRES_PASSWORD:-stickers}@postgres:5432/${POSTGRES_DB:-stickers}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-sticker-foundry}
      QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS:-3}
      QUEUE_BACKOFF_MS: ${QUEUE_BACKOFF_MS:-1000}
      JWT_SECRET: ${JWT_SECRET:-change-this-long-random-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_REFRESH_COOKIE_ENABLED: ${AUTH_REFRESH_COOKIE_ENABLED:-true}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      AUTH_REFRESH_COOKIE_SAME_SITE: ${AUTH_REFRESH_COOKIE_SAME_SITE:-lax}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-stickerfoundry_refresh}
      AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/api/auth}
      DATA_DIR: /data
      EXPORT_CACHE_DIR: ${EXPORT_CACHE_DIR:-/data/export-cache}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      PASSWORD_RESET_PUBLIC_URL: ${PASSWORD_RESET_PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
      INSTANCE_NAME: ${INSTANCE_NAME:-StickerFoundry}
      INSTANCE_DESCRIPTION: ${INSTANCE_DESCRIPTION:-Self-hosted sticker pack management}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PREFIX: ${S3_PREFIX:-packs}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-25000000}
      UPLOAD_MAX_TOTAL_PIXELS: ${UPLOAD_MAX_TOTAL_PIXELS:-80000000}
      UPLOAD_MAX_ANIMATED_EDIT_PIXELS: ${UPLOAD_MAX_ANIMATED_EDIT_PIXELS:-20000000}
      UPLOAD_MAX_ANIMATED_FRAMES: ${UPLOAD_MAX_ANIMATED_FRAMES:-300}
      MEDIA_QUEUE_CONCURRENCY: ${MEDIA_QUEUE_CONCURRENCY:-1}
      EXPORT_QUEUE_CONCURRENCY: ${EXPORT_QUEUE_CONCURRENCY:-1}
      EMAIL_QUEUE_CONCURRENCY: ${EMAIL_QUEUE_CONCURRENCY:-2}
      MEDIA_QUEUE_MAX_WAITING: ${MEDIA_QUEUE_MAX_WAITING:-50}
      MEDIA_QUEUE_RETRY_AFTER_SECONDS: ${MEDIA_QUEUE_RETRY_AFTER_SECONDS:-5}
      BACKGROUND_REMOVAL_COMMAND: ${BACKGROUND_REMOVAL_COMMAND:-}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - foundry-data:/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: sticker-foundry-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["node", "dist/worker.js"]
    container_name: sticker-foundry-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stickers}:${POSTGRES_PASSWORD:-stickers}@postgres:5432/${POSTGRES_DB:-stickers}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-sticker-foundry}
      QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS:-3}
      QUEUE_BACKOFF_MS: ${QUEUE_BACKOFF_MS:-1000}
      DATA_DIR: /data
      STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PREFIX: ${S3_PREFIX:-packs}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      EXPORT_CACHE_DIR: ${EXPORT_CACHE_DIR:-/data/export-cache}
      MEDIA_QUEUE_CONCURRENCY: ${MEDIA_QUEUE_CONCURRENCY:-1}
      EXPORT_QUEUE_CONCURRENCY: ${EXPORT_QUEUE_CONCURRENCY:-1}
      EMAIL_QUEUE_CONCURRENCY: ${EMAIL_QUEUE_CONCURRENCY:-2}
      BACKGROUND_REMOVAL_COMMAND: ${BACKGROUND_REMOVAL_COMMAND:-}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-25000000}
      UPLOAD_MAX_TOTAL_PIXELS: ${UPLOAD_MAX_TOTAL_PIXELS:-80000000}
      UPLOAD_MAX_ANIMATED_EDIT_PIXELS: ${UPLOAD_MAX_ANIMATED_EDIT_PIXELS:-20000000}
      UPLOAD_MAX_ANIMATED_FRAMES: ${UPLOAD_MAX_ANIMATED_FRAMES:-300}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - foundry-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  foundry-data:
