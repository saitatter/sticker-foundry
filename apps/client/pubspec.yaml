publish_to: 'none'

version: 1.3.0+10301

environment:
  sdk: ^3.13.5

dependencies:
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter

  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.0
  archive: ^4.5.2
  path: ^1.9.1
