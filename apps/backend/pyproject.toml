[project]
name = "sticker-foundry-backend"
version = "1.3.0"
description = "Sticker Foundry API and background workers"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyjwt>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "redis>=6,<9",
  "celery[redis]>=5.5,<6",
  "pillow>=11.3,<14",
  "numpy>=2.3,<3",
  "scipy>=1.16,<2",
  "boto3>=1.40,<2",
  "psutil>=7,<8",
]

[project.optional-dependencies]
ai = ["rembg[cpu]>=2.0.67,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundry"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx2>=2,<3", "ruff>=0.12,<1", "pip-audit>=2.9,<3", "pytest-playwright>=0.7,<1", "uiautomator2>=3,<4"]
