services:
  backend:
    volumes:
      - ./apps/backend/foundry:/app/foundry:ro
    command: ["sh", "-c", "python -m foundry.db_init && exec uvicorn foundry.main:app --host 0.0.0.0 --port 3000 --reload --reload-dir /app/foundry --no-access-log"]
  worker:
    volumes:
      - ./apps/backend/foundry:/app/foundry:ro
  export-worker:
    volumes:
      - ./apps/backend/foundry:/app/foundry:ro
  email-worker:
    volumes:
      - ./apps/backend/foundry:/app/foundry:ro
