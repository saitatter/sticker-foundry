services:
  minio:
    image: minio/minio:latest
    container_name: sticker-foundry-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: sticker-foundry-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-sticker-foundry}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing "local/$${S3_BUCKET}"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: sticker-foundry-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILHOG_UI_HOST_PORT:-8025}:8025"

  backend:
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    environment:
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:-sticker-foundry}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_PREFIX: ${S3_PREFIX:-packs}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ${SMTP_FROM:-noreply@stickerfoundry.local}
      AUTH_REFRESH_COOKIE_SECURE: "false"

  worker:
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    environment:
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:-sticker-foundry}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_PREFIX: ${S3_PREFIX:-packs}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ${SMTP_FROM:-noreply@stickerfoundry.local}
      EXPORT_QUEUE_CONCURRENCY: ${EXPORT_QUEUE_CONCURRENCY:-1}
      EMAIL_QUEUE_CONCURRENCY: ${EMAIL_QUEUE_CONCURRENCY:-2}

volumes:
  minio-data:
