name: Feature request
description: Suggest a new StickerFoundry capability.
title: "feat: "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should StickerFoundry do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Web
        - Android
        - Docker/Deploy
        - Release/CI
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra context
