name: Validate Release Config

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview release version
        id: semantic_preview
        run: npx semantic-release --dry-run 2>&1 | tee /tmp/sr-output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate backend build
        run: npm run build:backend

      - name: Validate web build
        run: npm run build:web

      - name: Validate shared types build
        run: npm --workspace packages/shared-types run build
