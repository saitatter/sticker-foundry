name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build backend
        run: npm run build:backend

      - name: Lint backend
        run: npm run lint:backend

      - name: Test backend
        run: npm run test:backend

      - name: Test backend e2e
        run: npm run test:e2e:backend

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Lint web
        run: npm run lint:web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Test web smoke flows
        run: npm run test:web

      - name: Test web units
        run: npm run test:web:unit

      - name: Validate Compose configurations
        run: npm run compose:validate

      - name: Build shared types
        run: npm --workspace packages/shared-types run build

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Lint Android debug
        working-directory: apps/android
        run: ./gradlew :app:lintDebug

      - name: Build Android debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Boot Compose stack
        run: docker compose up -d --build

      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend worker
          exit 1

      - name: Verify web and service status
        run: |
          curl --fail --silent http://localhost:8080/ >/dev/null
          docker compose ps

      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v
