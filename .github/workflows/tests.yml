name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build backend
        run: npm run build:backend

      - name: Lint backend
        run: npm run lint:backend

      - name: Test backend
        run: npm run test:backend

      - name: Test backend e2e
        run: npm run test:e2e:backend

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Lint web
        run: npm run lint:web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Test web smoke flows
        run: npm run test:web

      - name: Test web units
        run: npm run test:web:unit

      - name: Validate Compose configurations
        run: npm run compose:validate

      - name: Build shared types
        run: npm --workspace packages/shared-types run build

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/client
        run: flutter pub get

      - name: Build Android debug APK
        working-directory: apps/client
        run: flutter build apk --debug

      - name: Lint Android debug
        working-directory: apps/client/android
        run: ./gradlew :app:lintDebug

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Boot Compose stack
        run: docker compose up -d --build

      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend worker
          exit 1

      - name: Verify web and service status
        run: |
          curl --fail --silent http://localhost:8080/ >/dev/null
          docker compose ps

      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v

  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Build desktop client
        working-directory: apps/client
        run: flutter build ${{ matrix.target }} --release
      - name: Compile iOS without signing
        if: runner.os == 'macOS'
        working-directory: apps/client
        run: flutter build ios --release --no-codesign
