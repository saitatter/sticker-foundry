name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Check repository ignore rules
        run: npm run repo:check

      - name: Build backend
        run: npm run build:backend

      - name: Lint backend
        run: npm run lint:backend

      - name: Test backend
        run: npm run test:backend

      - name: Test backend e2e
        run: npm run test:e2e:backend

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Lint web
        run: npm run lint:web

      - name: Check original brand assets
        run: npm run brand:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Test web smoke flows
        run: npm run test:web

      - name: Test web units
        run: npm run test:web:unit

      - name: Validate Compose configurations
        run: npm run compose:validate

      - name: Build shared types
        run: npm --workspace packages/shared-types run build

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/client
        run: flutter pub get

      - name: Build Android debug APK
        working-directory: apps/client
        run: flutter build apk --debug

      - name: Lint Android debug
        working-directory: apps/client/android
        run: ./gradlew :app:lintDebug

      - name: Keep the Android QA build
        uses: actions/upload-artifact@v7
        with:
          name: sticker-foundry-android-${{ github.sha }}
          path: apps/client/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Boot Compose stack
        run: docker compose up -d --build

      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend worker
          exit 1

      - name: Verify web and service status
        run: |
          curl --fail --silent http://localhost:8080/ >/dev/null
          docker compose ps

      - name: Set up Node for live API acceptance
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install acceptance dependencies
        run: npm ci

      - name: Verify live accounts, permissions, media workers and exports
        run: npm run test:live
        env:
          LIVE_QA_API: http://localhost:3000/api/

      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v

  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Build desktop client
        working-directory: apps/client
        run: flutter build ${{ matrix.target }} --release
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path apps/client/build/windows/x64/runner/Release/* -DestinationPath dist/sticker-foundry-windows.zip
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent apps/client/build/macos/Build/Products/Release/*.app dist/sticker-foundry-macos.zip
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/sticker-foundry-linux.tar.gz -C apps/client/build/linux/x64/release/bundle .
      - name: Keep desktop QA build
        uses: actions/upload-artifact@v7
        with:
          name: sticker-foundry-${{ matrix.target }}-${{ github.sha }}
          path: dist/sticker-foundry-*
          retention-days: 7
      - name: Compile iOS without signing
        if: runner.os == 'macOS'
        working-directory: apps/client
        run: flutter build ios --release --no-codesign
