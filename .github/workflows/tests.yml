name: Tests
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, feat/python-backend]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.6'
          python-version: '3.13'
          enable-cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: npm ci
      - run: flutter pub get
        working-directory: apps/client
      - run: npx playwright install --with-deps
      - run: dart run tool/ci_check.dart --integration
      - name: Audit dependencies
        run: |
          uv run --project apps/backend pip-audit --skip-editable
          npm audit
      - name: Collect acceptance traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-traces
          path: test-results/playwright
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/client
        run: flutter pub get

      - name: Build Android debug APK
        working-directory: apps/client
        run: flutter build apk --debug

      - name: Lint Android debug
        working-directory: apps/client/android
        run: ./gradlew :app:lintDebug

      - name: Keep the Android QA build
        uses: actions/upload-artifact@v7
        with:
          name: sticker-foundry-android-${{ github.sha }}
          path: apps/client/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Build desktop client
        working-directory: apps/client
        run: flutter build ${{ matrix.target }} --release
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path apps/client/build/windows/x64/runner/Release/* -DestinationPath dist/sticker-foundry-windows.zip
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent apps/client/build/macos/Build/Products/Release/*.app dist/sticker-foundry-macos.zip
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/sticker-foundry-linux.tar.gz -C apps/client/build/linux/x64/release/bundle .
      - name: Keep desktop QA build
        uses: actions/upload-artifact@v7
        with:
          name: sticker-foundry-${{ matrix.target }}-${{ github.sha }}
          path: dist/sticker-foundry-*
          retention-days: 7
      - name: Compile iOS without signing
        if: runner.os == 'macOS'
        working-directory: apps/client
        run: flutter build ios --release --no-codesign
