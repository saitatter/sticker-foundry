name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit version, e.g. 2.0.0'
        type: string
      dry_run:
        description: Preview the version and curated notes without publishing
        type: boolean
        default: true
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
  prepare:
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Prepare curated changelog
        id: prepare
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=()
          if [[ -n "$REQUESTED_VERSION" ]]; then args+=(--version "$REQUESTED_VERSION"); fi
          if [[ "$DRY_RUN" == true ]]; then
            dart run tool/prepare_release.dart --check "${args[@]}"
            exit 0
          fi
          dart run tool/prepare_release.dart --notes "$RUNNER_TEMP/release-notes.md" "${args[@]}"
          version=$(python -c 'import tomllib; print(tomllib.load(open("apps/backend/pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md apps/client/pubspec.yaml apps/backend/pyproject.toml apps/backend/uv.lock package.json package-lock.json
          git commit -m "chore(release): v$version" -m 'Cut curated Unreleased notes and synchronize application versions.'
          git tag "v$version"
          git push origin HEAD:main "v$version"
          gh release create "v$version" --draft --title "v$version" --notes-file "$RUNNER_TEMP/release-notes.md"
  packages:
    needs: prepare
    if: inputs.dry_run == false
    uses: ./.github/workflows/docker-packages.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
  artifacts:
    needs: prepare
    if: inputs.dry_run == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: server
          - os: ubuntu-24.04
            target: android
          - os: ubuntu-24.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: matrix.target == 'android'
      - name: Server and web archives
        if: matrix.target == 'server'
        run: |
          python tool/package_server.py
          cd apps/client
          flutter build web --release --no-web-resources-cdn
          tar -czf ../../dist/sticker-foundry-web.tar.gz -C build/web .
      - name: Android APK
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p dist
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            (cd apps/client && flutter build apk --release)
            cp apps/client/build/app/outputs/flutter-apk/app-release.apk dist/sticker-foundry-android.apk
          else
            (cd apps/client && flutter build apk --debug)
            cp apps/client/build/app/outputs/flutter-apk/app-debug.apk dist/sticker-foundry-android-debug.apk
          fi
      - name: Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Build desktop
        if: contains(fromJSON('["linux","windows","macos"]'), matrix.target)
        working-directory: apps/client
        run: flutter build ${{ matrix.target }} --release
      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path apps/client/build/windows/x64/runner/Release/* -DestinationPath dist/sticker-foundry-windows.zip
      - name: Package macOS
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent apps/client/build/macos/Build/Products/Release/*.app dist/sticker-foundry-macos.zip
      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist
          tar -czf dist/sticker-foundry-linux.tar.gz -C apps/client/build/linux/x64/release/bundle .
      - name: Attach to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
  publish:
    needs: [prepare, packages, artifacts]
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    steps:
      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
