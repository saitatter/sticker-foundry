name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build backend
        run: npm run build:backend

      - name: Lint backend
        run: npm run lint:backend

      - name: Test backend
        run: npm run test:backend

      - name: Test backend e2e
        run: npm run test:e2e:backend

      - name: Build web
        run: npm run build:web

      - name: Lint web
        run: npm run lint:web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test web smoke flows
        run: npm run test:web

      - name: Build shared types
        run: npm --workspace packages/shared-types run build

      - name: Build Android debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets are not configured; publishing debug APK instead."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sticker-foundry-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sticker-foundry-release.keystore" >> "$GITHUB_ENV"

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx semantic-release
