version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Bucharest
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 10

  - package-ecosystem: uv
    directory: /apps/backend
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: pub
    directory: /apps/client
    schedule:
      interval: weekly
      day: monday
      time: '08:15'
      timezone: Europe/Bucharest
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:30'
      timezone: Europe/Bucharest
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns:
          - '*'
