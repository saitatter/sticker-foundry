services:
  sticker-foundry:
    image: ${STICKER_FOUNDRY_IMAGE:-ghcr.io/saitatter/sticker-foundry}:${STICKER_FOUNDRY_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_DB: ${POSTGRES_DB:-stickers}
      POSTGRES_USER: ${POSTGRES_USER:-stickers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stickers}
      JWT_SECRET: ${JWT_SECRET:-change-this-long-random-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      DATA_DIR: /data/app
      EXPORT_CACHE_DIR: ${EXPORT_CACHE_DIR:-/data/app/export-cache}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080/api}
      PASSWORD_RESET_PUBLIC_URL: ${PASSWORD_RESET_PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      INSTANCE_NAME: ${INSTANCE_NAME:-Sticker Foundry}
      INSTANCE_DESCRIPTION: ${INSTANCE_DESCRIPTION:-Self-hosted sticker pack management}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PREFIX: ${S3_PREFIX:-packs}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      UPLOAD_MAX_PIXELS: ${UPLOAD_MAX_PIXELS:-25000000}
      UPLOAD_MAX_TOTAL_PIXELS: ${UPLOAD_MAX_TOTAL_PIXELS:-80000000}
      UPLOAD_MAX_ANIMATED_EDIT_PIXELS: ${UPLOAD_MAX_ANIMATED_EDIT_PIXELS:-20000000}
      UPLOAD_MAX_ANIMATED_FRAMES: ${UPLOAD_MAX_ANIMATED_FRAMES:-300}
      MEDIA_QUEUE_CONCURRENCY: ${MEDIA_QUEUE_CONCURRENCY:-1}
      MEDIA_QUEUE_MAX_WAITING: ${MEDIA_QUEUE_MAX_WAITING:-50}
      MEDIA_QUEUE_RETRY_AFTER_SECONDS: ${MEDIA_QUEUE_RETRY_AFTER_SECONDS:-5}
      BACKGROUND_REMOVAL_COMMAND: ${BACKGROUND_REMOVAL_COMMAND:-rembg i {input} {output}}
      U2NET_HOME: ${U2NET_HOME:-/data/rembg-models}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ${UNRAID_APPDATA:-/mnt/user/appdata/sticker-foundry}/data:/data
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
